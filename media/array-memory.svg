<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="An array of five contiguous memory cells with indices and addresses">
  <rect width="640" height="200" fill="#ffffff"/>
  <text x="320" y="34" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Array in memory — contiguous cells</text>

  <!-- cells -->
  <g font-family="ui-monospace, monospace" font-size="16">
    <g>
      <rect x="60"  y="70" width="100" height="60" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="160" y="70" width="100" height="60" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="260" y="70" width="100" height="60" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="360" y="70" width="100" height="60" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="460" y="70" width="100" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    </g>
    <g fill="#0f172a" text-anchor="middle">
      <text x="110" y="106">12</text>
      <text x="210" y="106">7</text>
      <text x="310" y="106">99</text>
      <text x="410" y="106">3</text>
      <text x="510" y="106">42</text>
    </g>
  </g>

  <!-- indices -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600">
    <text x="110" y="58">[0]</text>
    <text x="210" y="58">[1]</text>
    <text x="310" y="58">[2]</text>
    <text x="410" y="58">[3]</text>
    <text x="510" y="58">[4]</text>
  </g>

  <!-- addresses -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#475569" text-anchor="middle">
    <text x="110" y="150">0x00</text>
    <text x="210" y="150">0x04</text>
    <text x="310" y="150">0x08</text>
    <text x="410" y="150">0x0C</text>
    <text x="510" y="150">0x10</text>
  </g>

  <!-- arithmetic note -->
  <text x="320" y="184" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0d9488">addr(arr[i]) = base + i × element_size</text>
</svg>
