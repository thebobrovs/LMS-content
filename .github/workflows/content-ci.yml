name: Content CI

# The automated gate of the staging → prod pipeline: validate all content
# (prod + staging) on every PR and push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Validate (prod + staging)
        run: node pipeline/validate.mjs --staging
