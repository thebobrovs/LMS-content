<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mixture of Experts routing</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app" aria-label="Mixture of Experts routing simulation"></main>
    <!-- Classic (non-module) scripts: the sim runs in a sandboxed, opaque-origin
         iframe (sandbox="allow-scripts", no allow-same-origin). ES module scripts
         are fetched with CORS and would be blocked from a null origin, so the SDK
         exposes a global `createSim` and these load as classic scripts. -->
    <script src="./sim-sdk.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
